<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=20260609-map">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">RA</span>
            <div>
                <strong>{{ app_name }}</strong>
                <small>苏州 Demo / 可扩展多城市</small>
            </div>
        </div>
        <nav>
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">数据概览</a>
            <a href="/ask" class="{% if request.url.path == '/ask' %}active{% endif %}">智能问答</a>
            <a href="/map" class="{% if request.url.path == '/map' %}active{% endif %}">地图分析</a>
            <a href="/reports" class="{% if request.url.path == '/reports' %}active{% endif %}">报告生成</a>
            <a href="/data" class="{% if request.url.path == '/data' %}active{% endif %}">数据管理</a>
        </nav>
        <div class="topbar-meta">
            <div class="model-state {% if llm_enabled %}online{% endif %}">
                {% if llm_enabled %}AI 已启用 · {{ model_name }}{% else %}本地统计模式{% endif %}
            </div>
            <div class="model-state {% if embedding_enabled %}online{% endif %}">
                {% if embedding_enabled %}Embedding · {{ embedding_model }}{% else %}未启用向量检索{% endif %}
            </div>
            <img class="institute-logo" src="{{ url_for('static', path='/logo.png') }}" alt="中国社会科学院数量经济与技术经济研究所">
        </div>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

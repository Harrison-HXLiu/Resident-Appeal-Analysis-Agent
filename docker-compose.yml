services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resident_appeals
      POSTGRES_USER: resident_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resident_app -d resident_appeals"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://resident_app:${POSTGRES_PASSWORD}@postgres:5432/resident_appeals
      AUTO_IMPORT_SAMPLE: "false"
      AUTH_REQUIRED: "true"
      SECURE_COOKIES: "true"
      WORKER_ENABLED: "true"
      PREGENERATE_STANDARD_REPORTS: "true"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-chat}
      MODEL_INPUT_COST_PER_MILLION: ${MODEL_INPUT_COST_PER_MILLION:-0}
      MODEL_OUTPUT_COST_PER_MILLION: ${MODEL_OUTPUT_COST_PER_MILLION:-0}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?set BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data:ro
      - app-instance:/app/instance
      - app-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  app-instance:
  app-uploads:
  caddy-data:
  caddy-config:
